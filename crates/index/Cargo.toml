[package]
name = "vorpal-index"
description = "CLI over the vorpal ingest → resolve → persist → query pipeline"
keywords = ["cli", "code-graph", "index", "query"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rayon.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde.workspace = true
serde_json = "1"
vorpal-ann.workspace = true
vorpal-ingest.workspace = true
vorpal-kg.workspace = true
tikv-jemallocator = { version = "0.7.0", optional = true }
tree-sitter.workspace = true
tikv-jemalloc-sys = { version = "0.7.1", optional = true }
fd-lock = "4.0.4"

[features]
# The vorpal-index BINARY's allocator (global jemalloc + tuned decay + tree-sitter routed
# through it — see main.rs). On by default so the shipped binary keeps its measured memory
# profile; embedded hosts take `default-features = false` and keep their own allocator —
# the library never sets a global allocator either way (docs/EMBEDDING.md).
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "vorpal-kg/alloc-stats"]

[dev-dependencies]
fd-lock = "4.0.4"
