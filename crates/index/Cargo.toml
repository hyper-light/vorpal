[package]
name = "vorpal-index"
description = "CLI over the vorpal ingest → resolve → persist → query pipeline"
keywords = ["cli", "code-graph", "index", "query"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rayon.workspace = true
regex.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde.workspace = true
serde_json = "1"
vorpal-ann.workspace = true
tar.workspace = true
vorpal-ingest.workspace = true
zstd.workspace = true
vorpal-language.workspace = true
vorpal-core.workspace = true
vorpal-kg.workspace = true
vorpal-mem.workspace = true
bytemuck = "1"
tree-sitter.workspace = true
fd-lock = "4.0.4"
# Optional-model installer (semantic-tier Stage 6): the ONE explicit,
# checksum-pinned download path (`vorpal enable`, SDK install APIs) — network and
# hashing stay out of every build that doesn't opt in.
ureq = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(not(any(target_env = "msvc", all(target_env = "musl", target_arch = "aarch64"))))'.dependencies]
tikv-jemallocator = { version = "0.7.0", optional = true }
tikv-jemalloc-sys = { version = "0.7.1", optional = true }
tikv-jemalloc-ctl = { version = "0.7.0", optional = true }

[features]
# The vorpal-index BINARY's allocator (global jemalloc + tuned decay + tree-sitter routed
# through it — see main.rs). On by default so the shipped binary keeps its measured memory
# profile; embedded hosts take `default-features = false` and keep their own allocator —
# the library never sets a global allocator either way (docs/EMBEDDING.md).
default = ["jemalloc", "builtin-parser"]
jemalloc = [
  "dep:tikv-jemallocator",
  "dep:tikv-jemalloc-sys",
  "dep:tikv-jemalloc-ctl",
  "vorpal-kg/alloc-stats",
  "vorpal-ingest/jemalloc",
]
# Every vorpal artifact ships EVERY grammar (product policy); these forwards keep the
# feature graph composable for non-vorpal embedders only.
builtin-parser = ["vorpal-ingest/builtin-parser", "vorpal-language/builtin-parser"]
napi-langs = ["vorpal-ingest/napi-langs", "vorpal-language/napi-lang"]
# Benchmark-only internal seams (`Searcher::open_exact`, the `bench` module) for the
# recorded sweeps and `cargo xtask searcheval`. NEVER a default: production builds carry
# no measurement entry points; see examples/sweep_semantic.rs.
bench-internals = []
# The optional-model installer (models::install + ModelVariant) — enabled by the
# CLI and the SDK crates; the enable/read half of `models` is always built.
model-install = ["dep:ureq", "dep:sha2"]
# Exact allocation/fault ledger (hyper-optimization campaign): wraps the binary's
# jemalloc in event counters printed at every phase stamp. Profiling builds only —
# never a default (the bench-internals discipline).
alloc-ledger = [
  "jemalloc",
  "vorpal-kg/alloc-ledger",
  "vorpal-ingest/alloc-ledger",
]

[dev-dependencies]
vorpal-query.workspace = true
fd-lock = "4.0.4"
vorpal-dynamic.workspace = true

# The recorded semantic-engine cost sweep (beam vs exact scan) behind the
# `exhaustive_cutover` fit — dev-only, gated so plain builds never compile it.
[[example]]
name = "sweep_semantic"
required-features = ["bench-internals"]
