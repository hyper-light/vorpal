[package]
name = "vorpal-index"
description = "CLI over the vorpal ingest → resolve → persist → query pipeline"
keywords = ["cli", "code-graph", "index", "query"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rayon.workspace = true
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde.workspace = true
serde_json = "1"
vorpal-ann.workspace = true
vorpal-ingest.workspace = true
vorpal-kg = { workspace = true, features = ["alloc-stats"] }
tikv-jemallocator = "0.7.0"
tree-sitter.workspace = true
tikv-jemalloc-sys = "0.7.1"
fd-lock = "4.0.4"

[dev-dependencies]
fd-lock = "4.0.4"
