name: '$NAME'
---
id: zig-opaque
language: Zig
role: item
symbolType: struct
rule:
  all:
    - kind: variable_declaration
    - not:
        inside:
          kind: function_declaration
          stopBy: end
    - has:
        kind: identifier
        pattern: $NAME
    - has:
        stopBy: end
        kind: opaque_declaration
name: '$NAME'
---
id: zig-container-field
language: Zig
role: member
parentRuleIds: [zig-struct, zig-union]
symbolType: field
rule:
  kind: container_field
  has:
    field: name
    pattern: $NAME
name: '$NAME'
isPublic: true
---
id: zig-enum-member
language: Zig
role: member
parentRuleIds: [zig-enum]
symbolType: enumMember
rule:
  kind: container_field
  has:
    field: name
    pattern: $NAME
name: '$NAME'
isPublic: true
---
id: zig-error-member
language: Zig
role: member
parentRuleIds: [zig-error-set]
symbolType: enumMember
rule:
  kind: identifier
  pattern: $NAME
  inside:
    kind: error_set_declaration
    stopBy: end
name: '$NAME'
isPublic: true
---
id: zig-test
language: Zig
role: item
symbolType: function
rule:
  kind: test_declaration
  has:
    any:
      - kind: string
      - kind: identifier
    pattern: $NAME
name: '$NAME'
---
id: zig-extern-function
language: Zig
role: item
symbolType: function
rule:
  kind: function_signature
  has:
    field: name
    pattern: $NAME
name: '$NAME'
isExported: true
