name: '$NAME'
---
id: zig-error-set
language: Zig
role: item
symbolType: enum
rule:
  all:
    - kind: variable_declaration
    - not:
        inside:
          kind: function_declaration
          stopBy: end
    - has:
        kind: identifier
        pattern: $NAME
    - has:
        stopBy: end
