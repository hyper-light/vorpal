id: zig-function
language: Zig
role: item
symbolType: function
rule:
  all:
    - kind: function_declaration
    - has:
        field: name
        pattern: $NAME
name: '$NAME'
---
id: zig-const
language: Zig
role: item
symbolType: constant
rule:
  all:
    - kind: variable_declaration
    - not:
        inside:
          kind: function_declaration
          stopBy: end
    - has:
        kind: identifier
        pattern: $NAME
    # Container definitions (`const Foo = struct {…}`) extract through the
    # dedicated rules below with their real kinds; `var` globals are variables.
    - not:
        has:
          stopBy: end
          any:
            - kind: struct_declaration
            - kind: enum_declaration
            - kind: union_declaration
            - kind: error_set_declaration
            - kind: opaque_declaration
    - not:
        regex: '^\s*(pub\s+|export\s+|extern\s+("[^"]*"\s+)?|threadlocal\s+)*var\b'
name: '$NAME'
---
id: zig-var
language: Zig
role: item
symbolType: variable
rule:
  all:
    - kind: variable_declaration
    - not:
        inside:
          kind: function_declaration
          stopBy: end
    - has:
        kind: identifier
        pattern: $NAME
    - not:
        has:
          stopBy: end
          any:
            - kind: struct_declaration
            - kind: enum_declaration
            - kind: union_declaration
            - kind: error_set_declaration
            - kind: opaque_declaration
    - regex: '^\s*(pub\s+|export\s+|extern\s+("[^"]*"\s+)?|threadlocal\s+)*var\b'
name: '$NAME'
---
id: zig-struct
language: Zig
role: item
symbolType: struct
rule:
  all:
    - kind: variable_declaration
    - not:
        inside:
          kind: function_declaration
          stopBy: end
    - has:
        kind: identifier
        pattern: $NAME
    - has:
        stopBy: end
        kind: struct_declaration
name: '$NAME'
---
id: zig-enum
