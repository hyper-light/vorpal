---
id: swift-extension
language: Swift
role: item
symbolType: class
# Extensions are class_declaration nodes with declaration_kind `extension`
# (the bare `extension` kind is an anonymous token — not matchable); the
# extended type nests as user_type > type_identifier, hence the descent.
rule:
  all:
    - kind: class_declaration
    - has:
        field: declaration_kind
        pattern: extension
    - has:
        stopBy: end
        kind: type_identifier
        pattern: $NAME
name: $NAME
isExported:
  has:
    kind: modifiers
    regex: 'public|open'
---
