id: erlang-module
language: Erlang
role: item
symbolType: module
rule:
  all:
    - kind: module_attribute
    - has:
        field: name
        pattern: $NAME
name: '$NAME'
---
id: erlang-function
language: Erlang
role: item
symbolType: function
rule:
  all:
    - kind: fun_decl
    - has:
        kind: function_clause
        has:
          field: name
          pattern: $NAME
name: '$NAME'
---
id: erlang-record
language: Erlang
role: item
symbolType: struct
rule:
  all:
    - kind: record_decl
    - has:
        field: name
        pattern: $NAME
name: '$NAME'
---
id: erlang-macro
language: Erlang
role: item
symbolType: macro
# `-define(NAME, …)` / `-define(NAME(Args), …)` — the lhs text carries the
# parameter list for function-like macros; strip it for the entity name.
rule:
  all:
    - kind: pp_define
    - has:
        field: lhs
        pattern: $LHS
transform:
  SYM:
    replace:
      source: $LHS
      replace: '\(.*$'
      by: ''
name: '$SYM'
isExported: true
---
id: erlang-type
language: Erlang
role: item
symbolType: typeAlias
rule:
  all:
    - kind: type_alias
    - has:
        field: name
        pattern: $NAME
name: '$NAME'
isExported: true
