id: go-import
language: Go
role: item
symbolType: module
rule:
  kind: import_spec
  has:
    pattern: '"$PATH"'
name: $PATH
isImport: true
isExported: false
---
id: go-function
language: Go
role: item
symbolType: function
rule:
  kind: function_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
---
id: go-method
language: Go
role: item
symbolType: method
rule:
  kind: method_declaration
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        field: receiver
        has:
          kind: type_identifier
          stopBy: end
          pattern: $RECV
name: $NAME
# Semantic membership: `func (w Widget) Render()` belongs to Widget. Adoption is
# file-local — a method beside its type (the dominant Go layout) nests under it, giving
# the method an owner (typed-receiver resolution) and a `Widget.Render` entity path;
# a method whose type lives in another file stays top-level, exactly as before.
memberOf: $RECV
---
id: go-struct-type
language: Go
role: item
symbolType: struct
rule:
  all:
    - kind: type_declaration
    - has:
        all:
          - kind: type_spec
          - has:
              field: name
              pattern: $NAME
          - has:
              kind: struct_type
name: $NAME
---
id: go-interface-type
language: Go
role: item
symbolType: interface
rule:
  all:
    - kind: type_declaration
    - has:
        all:
          - kind: type_spec
          - has:
              field: name
              pattern: $NAME
          - has:
              kind: interface_type
name: $NAME
---
id: go-struct-field
language: Go
role: member
parentRuleIds: [go-struct-type]
symbolType: field
rule:
  kind: field_declaration
  has:
    field: name
    pattern: $NAME
name: $NAME
isPublic:
  has:
    field: name
    regex: '^[A-Z]'
---
id: go-interface-method
language: Go
role: member
parentRuleIds: [go-interface-type]
symbolType: method
rule:
  kind: method_elem
  has:
    field: name
    pattern: $NAME
name: $NAME
isPublic:
  has:
    field: name
    regex: '^[A-Z]'
---
id: go-type
language: Go
role: item
# `type Foo int` defines a distinct named type — typedef-shaped, not a generic
# type parameter (extraction-coverage Wave 2 correction).
symbolType: typeAlias
rule:
  all:
    - kind: type_declaration
    - has:
        all:
          - kind: type_spec
          - has:
              field: name
              pattern: $NAME
          - not:
              has:
                kind: struct_type
          - not:
              has:
                kind: interface_type
name: $NAME
---
id: go-type-alias
language: Go
role: item
symbolType: typeAlias
rule:
  kind: type_alias
  has:
    field: name
    pattern: $NAME
name: $NAME
---
id: go-const
language: Go
role: item
symbolType: constant
rule:
  kind: const_spec
  has:
    pattern: $NAME
name: $NAME
---
id: go-var
language: Go
role: item
symbolType: variable
rule:
  kind: var_spec
  has:
    pattern: $NAME
name: $NAME
---
id: go-http-route-verb
language: Go
role: item
symbolType: route
nested: true
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: selector_expression
        has:
          field: field
          regex: '^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS|Get|Post|Put|Delete|Patch|Head|Options|Any)$'
          pattern: $METHOD
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: interpreted_string_literal
          has:
            kind: interpreted_string_literal_content
            regex: '^/'
            pattern: $ROUTE
    - has:
        field: arguments
        has:
          nthChild: 2
transform:
  VERB:
    convert:
      source: $METHOD
      toCase: upperCase
name: $VERB $ROUTE
---
id: go-http-route-handle
language: Go
role: item
symbolType: route
nested: true
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: selector_expression
        has:
          field: field
          regex: '^(HandleFunc|Handle)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: interpreted_string_literal
          has:
            kind: interpreted_string_literal_content
            regex: '^/'
            pattern: $ROUTE
    - has:
        field: arguments
        has:
          nthChild: 2
name: ROUTE $ROUTE
---
id: go-http-route-pattern
language: Go
role: item
symbolType: route
nested: true
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: selector_expression
        has:
          field: field
          regex: '^(HandleFunc|Handle)$'
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: interpreted_string_literal
          has:
            kind: interpreted_string_literal_content
            regex: '^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS) /'
            pattern: $ROUTE
    - has:
        field: arguments
        has:
          nthChild: 2
name: $ROUTE
---
id: go-event-channel
language: Go
role: item
symbolType: channel
nested: true
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: selector_expression
        has:
          field: field
          regex: '^Subscribe$'
    - has:
        field: arguments
        has:
          nthChild: 1
          kind: interpreted_string_literal
          has:
            kind: interpreted_string_literal_content
            pattern: $TOPIC
    - has:
        field: arguments
        has:
          nthChild: 2
name: EVENT $TOPIC
