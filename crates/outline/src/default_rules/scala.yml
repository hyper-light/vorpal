id: scala-class
language: Scala
role: item
symbolType: class
rule:
  all:
    - kind: class_definition
    - pattern: $DECL
    - has:
        field: name
        pattern: $NAME
transform:
  BODYLESS:
    replace:
      source: $DECL
      replace: '\s*(:|\{)[\s\S]*$'
      by: ''
  SIG:
    replace:
      source: $BODYLESS
      replace: '\n[\s\S]*$'
      by: ''
name: '$NAME'
signature: '$SIG'
