id: solidity-contract
language: Solidity
role: item
symbolType: class
rule:
  all:
    - kind: contract_declaration
    - pattern: $DECL
    - has:
        field: name
        pattern: $NAME
transform:
  BODYLESS:
    replace:
      source: $DECL
      replace: '\s*\{[\s\S]*$'
      by: ''
  SIG:
    replace:
      source: $BODYLESS
      replace: '\n[\s\S]*$'
      by: ''
name: '$NAME'
signature: '$SIG'
