id: dart-operator
language: Dart
role: member
parentRuleIds: [dart-class, dart-mixin, dart-enum, dart-extension, dart-extension-type]
symbolType: method
# The operator token can be anonymous (`[]`, `~`) — literal name, distinct by
# signature.
rule:
  kind: operator_signature
name: operator
isPublic: true
