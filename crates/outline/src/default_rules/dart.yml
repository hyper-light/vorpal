id: dart-class
language: Dart
role: item
symbolType: class
rule:
  all:
    - kind: class_declaration
    - pattern: $DECL
    - has:
        field: name
        pattern: $NAME
transform:
  BODYLESS:
    replace:
      source: $DECL
      replace: '\s*\{[\s\S]*$'
      by: ''
  SIG:
    replace:
      source: $BODYLESS
      replace: '\n[\s\S]*$'
      by: ''
name: '$NAME'
signature: '$SIG'
---
id: dart-mixin
language: Dart
role: item
symbolType: class
rule:
  all:
    - kind: mixin_declaration
    - has:
        field: name
