---
# Dart wraps a function's signature and body in `function_declaration`; matching the wrapper
# keeps the definition span covering the body (call attribution depends on it).
id: dart-function
language: Dart
role: item
symbolType: function
rule:
  all:
    - kind: function_declaration
    - pattern: $DECL
    - has:
        kind: function_signature
        has:
          kind: identifier
          pattern: $NAME
transform:
  BODYLESS:
    replace:
      source: $DECL
      replace: '\s*\{[\s\S]*$'
      by: ''
  SIG:
    replace:
      source: $BODYLESS
      replace: '\n[\s\S]*$'
      by: ''
name: '$NAME'
signature: '$SIG'
---
id: dart-typealias
language: Dart
role: item
symbolType: typeAlias
rule:
  kind: type_alias
  has:
    kind: type_identifier
    pattern: $NAME
name: '$NAME'
---
id: dart-extension-type
language: Dart
