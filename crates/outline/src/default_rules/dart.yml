name: '$NAME'
---
id: dart-top-level-variable
language: Dart
role: item
symbolType: variable
rule:
  kind: top_level_variable_declaration
  has:
    stopBy: end
    kind: identifier
    pattern: $NAME
name: '$NAME'
---
id: dart-external-function
language: Dart
role: item
symbolType: function
rule:
  kind: external_function_declaration
  has:
    stopBy: end
    kind: function_signature
    has:
      field: name
      pattern: $NAME
name: '$NAME'
---
id: dart-getter
language: Dart
role: member
parentRuleIds: [dart-class, dart-mixin, dart-enum, dart-extension, dart-extension-type]
symbolType: property
rule:
  kind: getter_signature
  has:
    field: name
    pattern: $NAME
name: '$NAME'
isPublic:
  not:
    has:
      field: name
      regex: '^_'
