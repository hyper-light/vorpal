id: rust-impl
language: Rust
role: item
symbolType: object
rule:
  all:
    - kind: impl_item
    - pattern: $DECL
    - has:
        field: type
        pattern: $NAME
transform:
  BODYLESS:
    replace:
      source: $DECL
      replace: '\s*\{[\s\S]*$'
      by: ''
  SIG:
    replace:
      source: $BODYLESS
      replace: '\n[\s\S]*$'
      by: ''
  # The impl's *name* is the plain type identifier — generic/lifetime arguments are stripped so
  # `impl<'a> Reader<'a>` names `Reader`, sharing identity with the type it implements (the full
  # form stays in the signature). Specialized impls (`impl Foo<String>`) merge under one name.
  TYPENAME:
    replace:
      source: $NAME
      replace: '\s*<[\s\S]*$'
      by: ''
name: '$TYPENAME'
signature: '$SIG'
isExported: false
