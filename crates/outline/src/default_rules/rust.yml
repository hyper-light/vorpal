          stopBy: end
    - not:
        inside:
          kind: trait_item
          stopBy: end
    - not:
        inside:
          kind: block
          stopBy: end
transform:
  BODYLESS:
    replace:
      source: $DECL
      replace: '\s*\{[\s\S]*$'
      by: ''
  SIG:
    replace:
      source: $BODYLESS
      replace: '\n[\s\S]*$'
