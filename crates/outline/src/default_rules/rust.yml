---
id: rust-const
language: Rust
role: item
symbolType: constant
# Top-level `const X: T = …;` — associated consts (impl/trait) and
# function-local ones are out of item scope.
rule:
  all:
    - kind: const_item
    - has:
        field: name
        pattern: $NAME
    - not:
        inside:
          stopBy: end
          any:
            - kind: trait_item
            - kind: impl_item
            - kind: function_item
name: '$NAME'
isExported:
  has:
    kind: visibility_modifier
    regex: '^pub'
