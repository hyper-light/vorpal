id: cpp-include
language: Cpp
role: item
symbolType: module
rule:
  kind: preproc_include
  has:
    field: path
    pattern: $PATH
name: $PATH
isImport: true
isExported: false
---

id: cpp-function
language: Cpp
role: item
symbolType: function
# The function declarator may sit under pointer/reference wrappers (`void *f()`,
# `Widget &g()`) — without the descend branch those definitions were silently absent. The
# name node binds whole (identifier, qualified_identifier, operator_name, destructor_name),
# preserving qualified spellings like `Widget::method`.
rule:
  kind: function_definition
  has:
    field: declarator
    any:
      - kind: function_declarator
        has:
          field: declarator
          pattern: $NAME
      - has:
          kind: function_declarator
          stopBy: end
          has:
            field: declarator
            pattern: $NAME
name: $NAME
# Internal linkage is honest visibility: `static` at namespace scope is TU-local.
isExported:
  not:
    has:
      kind: storage_class_specifier
      regex: ^static$
---

id: cpp-class
language: Cpp
role: item
symbolType: class
# Type references and forward declarations are not definitions: require the body.
rule:
  kind: class_specifier
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        field: body
        kind: field_declaration_list
name: $NAME
---

id: cpp-struct
language: Cpp
role: item
symbolType: struct
# Type references and forward declarations are not definitions: require the body.
rule:
  kind: struct_specifier
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        field: body
        kind: field_declaration_list
name: $NAME
---

id: cpp-enum
language: Cpp
role: item
symbolType: enum
# Type references and forward declarations are not definitions: require the body.
rule:
  kind: enum_specifier
  all:
    - has:
        field: name
        pattern: $NAME
    - has:
        field: body
        kind: enumerator_list
name: $NAME
---

id: cpp-concept
language: Cpp
role: item
symbolType: interface
rule:
  kind: concept_definition
  has:
    field: name
    pattern: $NAME
name: $NAME
---

id: cpp-member-method
language: Cpp
role: member
parentRuleIds: [cpp-class, cpp-struct]
symbolType: method
# A method's function declarator names a *field identifier directly* (possibly under
# pointer/reference wrappers for pointer-returning methods). A function-pointer member
# (`int (*cb)(int);`) fails that test — its declarator is parenthesized — and correctly
# falls through to the field rule instead of becoming a method named `(*cb)`.
rule:
  kind: field_declaration
  has:
    field: declarator
    any:
      - kind: function_declarator
        has:
          field: declarator
          kind: field_identifier
          pattern: $NAME
      - has:
          kind: function_declarator
          stopBy: end
          has:
            field: declarator
            kind: field_identifier
            pattern: $NAME
name: $NAME
isPublic: false
---

id: cpp-member-constructor
language: Cpp
role: member
parentRuleIds: [cpp-class, cpp-struct]
symbolType: constructor
rule:
  kind: declaration
  has:
    field: declarator
    kind: function_declarator
    has:
      field: declarator
      pattern: $NAME
name: $NAME
isPublic: false
---

id: cpp-member-field
language: Cpp
role: member
parentRuleIds: [cpp-class, cpp-struct]
symbolType: field
# The name is the field identifier inside the declarator (pointer fields were `*cursor`).
# The exclusion mirrors the method rule exactly: anything the method rule claims — a
# function declarator naming a field identifier directly, wrapped or not — is not a field;
# function-pointer members don't fit that shape and stay fields.
rule:
  kind: field_declaration
  has:
    field: declarator
    any:
      - kind: field_identifier
        pattern: $NAME
      - has:
          kind: field_identifier
          stopBy: end
          pattern: $NAME
  not:
    has:
      field: declarator
      any:
        - kind: function_declarator
          has:
            field: declarator
            kind: field_identifier
        - has:
            kind: function_declarator
            stopBy: end
            has:
              field: declarator
              kind: field_identifier
name: $NAME
isPublic: false
---

id: cpp-nested-class
language: Cpp
role: member
parentRuleIds: [cpp-class, cpp-struct]
symbolType: class
rule:
  kind: class_specifier
  has:
    field: name
    pattern: $NAME
name: $NAME
isPublic: false
---

id: cpp-nested-struct
language: Cpp
role: member
parentRuleIds: [cpp-class, cpp-struct]
symbolType: struct
rule:
  kind: struct_specifier
  has:
    field: name
    pattern: $NAME
name: $NAME
isPublic: false
---

id: cpp-enum-member
language: Cpp
role: member
parentRuleIds: [cpp-enum]
symbolType: enumMember
rule:
  kind: enumerator
  has:
    field: name
    pattern: $NAME
name: $NAME
isPublic: true
