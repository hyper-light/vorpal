id: csharp-member-operator
language: CSharp
role: member
parentRuleIds: [csharp-class, csharp-record, csharp-struct]
symbolType: method
# The operator token (`+`, `==`, …) is an anonymous node — metavariables cannot
# bind it, so the name is literal; overloads stay distinct by signature (the
# full declaration text), per `SymbolKind::is_overloadable`.
rule:
  kind: operator_declaration
name: operator
isPublic:
  has:
    kind: modifier
    regex: '^public$'
---
id: csharp-member-conversion-operator
