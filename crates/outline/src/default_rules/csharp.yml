role: member
parentRuleIds: [csharp-class, csharp-record, csharp-struct]
symbolType: method
rule:
  kind: conversion_operator_declaration
  has:
    field: type
    pattern: $TYPE
name: operator $TYPE
isPublic:
  has:
    kind: modifier
    regex: '^public$'
