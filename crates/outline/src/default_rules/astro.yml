  all:
    - kind: element
    - any:
        - has:
            kind: start_tag
            has:
              kind: tag_name
              pattern: $NAME
        - has:
            kind: self_closing_tag
            has:
              kind: tag_name
              pattern: $NAME
name: '$NAME'
