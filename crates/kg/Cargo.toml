[package]
name = "vorpal-kg"
description = "Knowledge-graph assembly (L1→L3): outline extraction → interned nodes + graph edges"
keywords = ["knowledge-graph", "code-graph", "extraction", "ingest"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
vorpal-mem.workspace = true
vorpal-segment.workspace = true
vorpal-graph.workspace = true
vorpal-canonical.workspace = true
vorpal-outline.workspace = true
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"], optional = true }
rayon.workspace = true
bytemuck = "1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[features]
alloc-stats = ["dep:tikv-jemalloc-ctl"]
