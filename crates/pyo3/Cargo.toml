[package]
name = "vorpal-py"
description = "Search and Rewrite code at large scale using precise AST pattern"
keywords = ["ast", "pattern", "codemod", "search", "rewrite"]

authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vorpal_py"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.116"
vorpal-core.workspace = true
vorpal-config.workspace = true
vorpal-language.workspace = true
vorpal-dynamic.workspace = true
vorpal-index = { workspace = true, features = ["model-install"] }
vorpal-kg.workspace = true
anyhow.workspace = true
pyo3 = { version = "0.29.0", optional = true, features = ["anyhow", "py-clone"] }
pythonize = { version = "0.29.0", optional = true }
serde.workspace = true
crossbeam-channel = { workspace = true }

# uncomment default features when developing pyo3
[features]
# default = ["python"]
python = ["pythonize", "pyo3", "pyo3/extension-module", "pyo3/abi3-py39"]

# The extension's Rust allocations use jemalloc off Windows: macOS/glibc default malloc
# lock-contends hard under the async pool's concurrent searches (measured ~3.5x CPU
# amplification at N=32). jemalloc's per-thread arenas remove that. Python's own
# allocations are unaffected (they use pymalloc). MSVC keeps the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7.0"

[lints]
workspace = true
