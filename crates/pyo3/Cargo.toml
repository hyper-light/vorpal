[package]
name = "vorpal-py"
description = "Search and Rewrite code at large scale using precise AST pattern"
keywords = ["ast", "pattern", "codemod", "search", "rewrite"]

authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
edition.workspace = true
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vorpal_py"
crate-type = ["cdylib"]

[dependencies]
vorpal-core.workspace = true
vorpal-config.workspace = true
vorpal-language.workspace = true
vorpal-dynamic.workspace = true
anyhow.workspace = true
pyo3 = { version = "0.29.0", optional = true, features = ["anyhow", "py-clone"] }
pythonize = { version = "0.29.0", optional = true }
serde.workspace = true

# uncomment default features when developing pyo3
[features]
# default = ["python"]
python = ["pythonize", "pyo3", "pyo3/extension-module", "pyo3/abi3-py39"]