[package]
name = "vorpal-mcp"
description = "Warm-index MCP daemon: vorpal knowledge-graph queries served to agents over stdio"
keywords = ["mcp", "agents", "code-graph", "daemon", "json-rpc"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
vorpal-index.workspace = true
vorpal-ingest.workspace = true
vorpal-kg.workspace = true
vorpal-query.workspace = true

ignore.workspace = true
notify = "8"
serde.workspace = true
serde_json = "1"
vorpal-config.workspace = true
vorpal-core.workspace = true
vorpal-language.workspace = true
serde_yaml.workspace = true

# MSVC has no jemalloc; the binary's #[global_allocator] is cfg-gated to match.
[target.'cfg(not(any(target_env = "msvc", all(target_env = "musl", target_arch = "aarch64"))))'.dependencies]
# The binary links jemalloc (below), so the ingest crate's jemalloc-aware paths must be
# compiled in too: the phase-seam purge (`release_freed_pages`) and the batch decay switch
# (`retain_dirty_pages_for_batch_run`) are no-ops without this feature — as they were, unnoticed,
# in every `vorpal` and `vorpal-mcp` build before 0.8.4 (BENCHMARKS.md 2026-09-06).
vorpal-ingest = { workspace = true, features = ["jemalloc"] }
tikv-jemallocator = "0.7.0"

[dev-dependencies]
vorpal-dynamic.workspace = true

[lints]
workspace = true
