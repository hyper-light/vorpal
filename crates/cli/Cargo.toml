[package]
name = "vorpal"
description = "Search and Rewrite code at large scale using precise AST pattern"
keywords = ["ast", "pattern", "codemod", "search", "rewrite"]
categories = ["command-line-utilities", "development-tools", "parsing"]
default-run = "vorpal"
# use relative path because maturin does not recognize
readme = "../../README.md"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "vorpal"
path = "src/main.rs"

[[bin]]
name = "vp"
path = "src/bin/alias.rs"

[dependencies]
vorpal-core.workspace = true
vorpal-config.workspace = true
vorpal-dynamic.workspace = true
vorpal-index.workspace = true
vorpal-lang-registry.workspace = true
vorpal-language.workspace = true
vorpal-lsp.workspace = true
vorpal-mcp.workspace = true
vorpal-outline.workspace = true
vorpal-wire = { workspace = true, features = ["tokio"] }
vorpal-transport = { workspace = true, features = ["ssh"] }
vorpal-loader = { workspace = true, features = ["keygen"] }
tree-sitter.workspace = true
blake3.workspace = true
rayon.workspace = true
base64 = "0.22"

ansi_term = "0.12.1"
anyhow.workspace = true
atty = "0.2.14"
clap = { version = "4.5.4", features = ["derive"] }
codespan-reporting = "0.13.0"
crossterm = "0.29.0"
ignore.workspace = true
regex.workspace = true
dashmap.workspace = true
termimad = "0.34.0"
terminal-light = "1.8.0"
inquire = "0.9.0"
memchr = "2"
serde.workspace = true
serde_json = "1.0.116"
serde_yaml.workspace = true
serde-sarif = "0.8.0"
similar = { version = "3.0.0", features = ["inline"] }
smallvec = "1.13.2"
tokio = { version = "1.37.0", features = ["rt-multi-thread", "io-std", "io-util", "sync", "time", "macros"] }
clap_complete = "4.5.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
tempfile = "3.10.1"
# In-process SSH server for the remote-stream / SSH differential tests (a hermetic "VM").
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
rand_core = { version = "0.6.4", features = ["getrandom", "std"] }
tokio = { version = "1.37", features = ["full"] }

# Support cargo bininstall, https://github.com/hyper-light/vorpal/issues/1742
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/app-{ target }{ archive-suffix }"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

# jemalloc is the binary's allocator on every platform except MSVC (tikv-jemalloc-sys does
# not build there); main.rs cfg-gates the #[global_allocator] to match.
[target.'cfg(not(any(target_env = "msvc", all(target_env = "musl", target_arch = "aarch64"))))'.dependencies]
tikv-jemallocator = "0.7.0"
tikv-jemalloc-sys = "0.7.1"
