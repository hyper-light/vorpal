[package]
name = "vorpal-transport"
description = "Vorpal fleet transports: exec-shaped async connections to remote nodes (subprocess, SSH, …)"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# SSH backend via russh (pure-Rust, rustls, static-musl-clean).
ssh = ["dep:russh"]

[dependencies]
vorpal-wire = { workspace = true, features = ["tokio"] }
tokio = { version = "1.37", features = ["rt", "rt-multi-thread", "io-util", "io-std", "process", "net", "time", "sync", "macros"] }
async-trait = "0.1"
thiserror = { workspace = true }
tracing = "0.1"
russh = { version = "0.54", optional = true, default-features = false, features = ["ring", "flate2"] }

[dev-dependencies]
tokio = { version = "1.37", features = ["full"] }
tempfile = "3.10"
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
rand_core = { version = "0.6.4", features = ["getrandom", "std"] }

[lints]
workspace = true
