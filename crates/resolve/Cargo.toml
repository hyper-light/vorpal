[package]
name = "vorpal-resolve"
description = "Cross-file reference resolution (§3.3): references → definitions with confidence"
keywords = ["resolution", "code-graph", "symbols", "cross-file", "references"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
rustc-hash = "2.1.2"
foldhash = "0.1"
hashbrown = { version = "0.15", default-features = false }
crossbeam-utils.workspace = true
crossbeam-channel.workspace = true
rayon.workspace = true
vorpal-kg.workspace = true

[features]
# Contention probes for the hyper-optimization ledger (interner shard locks).
# Forwarded by the vorpal-index binary's `alloc-ledger`; never a default.
alloc-ledger = ["vorpal-kg/alloc-ledger"]

[dev-dependencies]
vorpal-outline.workspace = true
