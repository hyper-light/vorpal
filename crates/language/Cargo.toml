[package]
name = "vorpal-language"
description = "Search and Rewrite code at large scale using precise AST pattern"
keywords = ["ast", "pattern", "codemod", "search", "rewrite"]

authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
vorpal-core = { workspace = true, features = ["tree-sitter"] }

ignore.workspace = true
serde.workspace = true
tree-sitter.workspace = true
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

tree-sitter-bash = { version = "0.25.0", optional = true }
tree-sitter-cmake = { version = "0.7.4", optional = true }
tree-sitter-erlang = { version = "0.20.0", optional = true }
tree-sitter-julia = { version = "0.23.1", optional = true }
tree-sitter-objc = { version = "3.0.2", optional = true }
tree-sitter-ocaml = { version = "0.25.0", optional = true }
tree-sitter-perl = { version = "1.1.2", optional = true }
tree-sitter-powershell = { version = "0.26.4", optional = true }
tree-sitter-r = { version = "1.3.0", optional = true }
tree-sitter-sequel = { version = "0.3.11", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }
tree-sitter-dockerfile = { version = "0.2.0", optional = true }
tree-sitter-graphql = { version = "0.2.1", optional = true }
tree-sitter-ini = { version = "1.4.0", optional = true }
tree-sitter-make = { version = "1.1.1", optional = true }
tree-sitter-proto = { version = "0.5.0", optional = true }
tree-sitter-xml = { version = "0.7.0", optional = true }
tree-sitter-cpp = { version = "0.23.0", optional = true }
tree-sitter-c-sharp = { version = "0.23.0", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-dart = { version = "0.2.0", optional = true }
tree-sitter-c = { version = "0.24.0", optional = true }
tree-sitter-elixir = { version = "0.3.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-haskell = { version = "0.23.0", optional = true }
tree-sitter-html = { version = "0.23.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-kotlin = { version = "0.4.1", optional = true, package = "tree-sitter-kotlin-sg" }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-md = { version = "0.5.3", optional = true }
tree-sitter-nix = { version = "0.3.0", optional = true }
tree-sitter-php = { version = "0.24.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-ruby = { version = "0.23.0", optional = true }
tree-sitter-rust = { version = "0.24.0", optional = true }
tree-sitter-scala = { version = "0.26.0", optional = true }
tree-sitter-solidity = { version = "1.2.11", optional = true }
tree-sitter-swift = { version = "0.7.0", optional = true }
tree-sitter-toml = { version = "0.7.0", optional = true, package = "tree-sitter-toml-ng" }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = { version = "0.7.0", optional = true }
tree-sitter-hcl = { version = "1.1.0", optional = true }

[features]
builtin-parser = [
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-cmake",
  "tree-sitter-dockerfile",
  "tree-sitter-erlang",
  "tree-sitter-julia",
  "tree-sitter-objc",
  "tree-sitter-ocaml",
  "tree-sitter-perl",
  "tree-sitter-powershell",
  "tree-sitter-r",
  "tree-sitter-sequel",
  "tree-sitter-zig",
  "tree-sitter-graphql",
  "tree-sitter-ini",
  "tree-sitter-make",
  "tree-sitter-proto",
  "tree-sitter-xml",
  "tree-sitter-cpp",
  "tree-sitter-c-sharp",
  "tree-sitter-css",
  "tree-sitter-dart",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-haskell",
  "tree-sitter-hcl",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-json",
  "tree-sitter-kotlin",
  "tree-sitter-lua",
  "tree-sitter-md",
  "tree-sitter-nix",
  "tree-sitter-php",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-solidity",
  "tree-sitter-swift",
  "tree-sitter-toml",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
]
napi-lang = [
  "tree-sitter-css",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-typescript",
]
default = ["builtin-parser"]

[dev-dependencies]
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
serde_json = "1"
