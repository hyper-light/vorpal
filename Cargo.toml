[workspace]
members = [
  "crates/*",
  "xtask"
]
default-members = ["crates/*"]
resolver = "2"

[profile.release]
lto = true

[workspace.package]
version = "0.3.0"
authors = ["Herrington Darkholme <2883231+HerringtonDarkholme@users.noreply.github.com>"]
edition = "2024"
license = "MIT"
documentation = "https://github.com/hyper-light/vorpal"
homepage = "https://github.com/hyper-light/vorpal"
repository = "https://github.com/hyper-light/vorpal"
rust-version = "1.85"
readme = "README.md"

[workspace.dependencies]
vorpal-core = { path = "crates/core", version = "0.3.0", default-features = false }
vorpal-ann = { path = "crates/ann", version = "0.3.0" }
vorpal-canonical = { path = "crates/canonical", version = "0.3.0" }
vorpal-config = { path = "crates/config", version = "0.3.0" }
vorpal-dynamic = { path = "crates/dynamic", version = "0.3.0" }
vorpal-graph = { path = "crates/graph", version = "0.3.0" }
vorpal-index = { path = "crates/index", version = "0.3.0", default-features = false }
vorpal-ingest = { path = "crates/ingest", version = "0.3.0" }
vorpal-kg = { path = "crates/kg", version = "0.3.0" }
vorpal-lang-registry = { path = "crates/lang-registry", version = "0.3.0" }
vorpal-language = { path = "crates/language", version = "0.3.0" }
vorpal-loader = { path = "crates/loader", version = "0.3.0" }
vorpal-lsp = { path = "crates/lsp", version = "0.3.0" }
vorpal-mcp = { path = "crates/mcp", version = "0.3.0" }
vorpal-mem = { path = "crates/mem", version = "0.3.0" }
vorpal-outline = { path = "crates/outline", version = "0.3.0" }
vorpal-query = { path = "crates/query", version = "0.3.0" }
vorpal-resolve = { path = "crates/resolve", version = "0.3.0" }
vorpal-segment = { path = "crates/segment", version = "0.3.0" }
vorpal-transport = { path = "crates/transport", version = "0.3.0" }
vorpal-wire = { path = "crates/wire", version = "0.3.0" }

bit-set = { version = "0.10.0" }
blake3 = "1.8"
ignore = { version = "0.4.22" }
regex = { version = "1.10.4" }
serde = { version = "1.0.200", features = ["derive"] }
serde_regex = "1.2.0"
serde_yaml = "0.9.33"
tar = "0.4.44"
zstd = "0.13.3"
tree-sitter = { version = "0.26.3" }
thiserror = "2.0.0"
schemars = "1.0.0"
anyhow = "1.0.82"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
dashmap = "6.0.0"
rayon = "1.10.0"

# Vendored grammars — utter control over the exact parser bytes vorpal ships (and the
# ability to fix a grammar ourselves, e.g. PEP 810 lazy imports, without waiting on upstream
# maintainers). Overrides the crates.io grammar with our in-tree copy; consumers reference
# `tree_sitter_python` unchanged. Grammars are updated deliberately, per vorpal release —
# one binary, one version, one deterministic parser set. See docs/UPSTREAM.md for the sync
# ledger.
[patch.crates-io]
# Vendored tree-sitter *runtime* (not just grammars): the parser is ~two-thirds of cold-index
# CPU, so the C runtime (lexer/parser/subtree/stack) is ours to profile and optimize in-tree.
# See docs/UPSTREAM.md for the sync ledger.
tree-sitter = { path = "vendor/tree-sitter" }
tree-sitter-cmake = { path = "grammars/tree-sitter-cmake" }
tree-sitter-astro-next = { path = "grammars/tree-sitter-astro-next" }
tree-sitter-erlang = { path = "grammars/tree-sitter-erlang" }
tree-sitter-jsdoc = { path = "grammars/tree-sitter-jsdoc" }
tree-sitter-svelte-ng = { path = "grammars/tree-sitter-svelte-ng" }
tree-sitter-vue = { path = "grammars/tree-sitter-vue" }
tree-sitter-julia = { path = "grammars/tree-sitter-julia" }
tree-sitter-objc = { path = "grammars/tree-sitter-objc" }
tree-sitter-ocaml = { path = "grammars/tree-sitter-ocaml" }
tree-sitter-perl = { path = "grammars/tree-sitter-perl" }
tree-sitter-powershell = { path = "grammars/tree-sitter-powershell" }
tree-sitter-r = { path = "grammars/tree-sitter-r" }
tree-sitter-sequel = { path = "grammars/tree-sitter-sequel" }
tree-sitter-zig = { path = "grammars/tree-sitter-zig" }
tree-sitter-dockerfile = { path = "grammars/tree-sitter-dockerfile" }
tree-sitter-graphql = { path = "grammars/tree-sitter-graphql" }
tree-sitter-ini = { path = "grammars/tree-sitter-ini" }
tree-sitter-make = { path = "grammars/tree-sitter-make" }
