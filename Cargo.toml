tree-sitter-elixir = { path = "grammars/tree-sitter-elixir" }
tree-sitter-go = { path = "grammars/tree-sitter-go" }
tree-sitter-haskell = { path = "grammars/tree-sitter-haskell" }
tree-sitter-hcl = { path = "grammars/tree-sitter-hcl" }
tree-sitter-html = { path = "grammars/tree-sitter-html" }
tree-sitter-java = { path = "grammars/tree-sitter-java" }
tree-sitter-javascript = { path = "grammars/tree-sitter-javascript" }
