# CLI release: build the `vorpal` binary for every supported platform and attach each one to
# the GitHub Release DIRECTLY — one raw binary per platform, named `vorpal-<os>-<arch>` (Windows:
# `vorpal-windows-<arch>.exe`), no archive to unpack. cargo-binstall's per-target overrides in
# crates/cli/Cargo.toml expect exactly these names. Also publishes the @hyper-light/vorpal-cli
# wrapper + its per-platform binary packages.
#
# Triggers: pushing a tag `v<version>` does the full release; workflow_dispatch runs the build
# matrix only (a dry run — nothing is released or published without a tag).
#
# Required repository secrets: NPM_TOKEN (npm publish). GITHUB_TOKEN is provided automatically.
#
# Platform coverage: aarch64/arm64 + x86_64/amd64 across macOS, Linux glibc (Debian, Fedora,
# Ubuntu, Arch, …), Linux musl (Alpine), and Windows (plus 32-bit Windows).
name: Release CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Musl lanes build natively (x86_64 on ubuntu-latest, aarch64 on ubuntu-24.04-arm) with
  # the musl.cc NATIVE toolchain installed to /opt/musl by the "Install musl toolchain"
  # steps. It replaced musl-tools' musl-gcc when tree-sitter-vue's C++ scanner joined the
  # build: musl-tools ships no C++ compiler, while musl.cc's gcc/g++ are full musl-target
  # drivers with the same correct static library group ordering musl-gcc was pinned for
  # (the default host-cc driver mislinks static musl binaries that carry tokio + jemalloc
  # — undefined `pow`, libc.a ordered before the objects needing it). The linker is g++ so
  # cc-rs's `-lstdc++` for C++ scanners resolves against the toolchain's static libstdc++.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: /opt/musl/bin/aarch64-linux-musl-g++
  CC_aarch64_unknown_linux_musl: /opt/musl/bin/aarch64-linux-musl-gcc
  CXX_aarch64_unknown_linux_musl: /opt/musl/bin/aarch64-linux-musl-g++
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: /opt/musl/bin/x86_64-linux-musl-g++
  CC_x86_64_unknown_linux_musl: /opt/musl/bin/x86_64-linux-musl-gcc
  CXX_x86_64_unknown_linux_musl: /opt/musl/bin/x86_64-linux-musl-g++

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} != workspace version v${version}"; exit 1; }

  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, asset: vorpal-macos-arm64 }
          - { target: x86_64-apple-darwin, os: macos-latest, asset: vorpal-macos-x64 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, asset: vorpal-linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, asset: vorpal-linux-arm64 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, asset: vorpal-linux-x64-musl }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, asset: vorpal-linux-arm64-musl }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, asset: vorpal-windows-x64.exe }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, asset: vorpal-windows-arm64.exe }
          - { target: i686-pc-windows-msvc, os: windows-latest, asset: vorpal-windows-x86.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: |
          set -euo pipefail
          # musl.cc native toolchain for this runner's own architecture (both musl lanes
          # build natively). Retried download; the compile smoke below is the real gate.
          arch="$(uname -m)"
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/musl-native.tgz \
            "https://musl.cc/${arch}-linux-musl-native.tgz"
          sudo mkdir -p /opt/musl
          sudo tar -xzf /tmp/musl-native.tgz -C /opt/musl --strip-components=1
          rm /tmp/musl-native.tgz
          printf 'int main(void){return 0;}' > /tmp/musl-smoke.c
          "/opt/musl/bin/${arch}-linux-musl-gcc" -static /tmp/musl-smoke.c -o /tmp/musl-smoke-c
          printf 'int main(){return 0;}' > /tmp/musl-smoke.cc
          "/opt/musl/bin/${arch}-linux-musl-g++" -static -static-libstdc++ /tmp/musl-smoke.cc -o /tmp/musl-smoke-cc
          /tmp/musl-smoke-c && /tmp/musl-smoke-cc
          rm -f /tmp/musl-smoke*
      - name: Build
        env:
          # musl-gcc links against shared libgcc_s.so.1 by default, which runners lack.
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=+crt-static -C link-arg=-static-libgcc -C link-arg=-static-libstdc++' || '' }}
        run: cargo build --release -p vorpal --target ${{ matrix.target }}
      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/vorpal" "${{ matrix.asset }}"
      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/vorpal.exe" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # The remote-fleet stage-0 loader + the signed agent (docs/REMOTE.md §2, §6). The agent is the
  # musl `vorpal` binary run as `__agent`; the loader verifies its Ed25519 signature over the
  # blake3 hash and execs it from a memfd (zero on-disk residue). When the repo has a signing key,
  # the loader embeds the matching public key and a pre-signed `.vld` stream is shipped; otherwise
  # the loader is built to accept `--pubkey` at runtime and only the blake3 pin is recorded.
  agent-bundle:
    name: Agent bundle ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    env:
      SIGNING_KEY: ${{ secrets.VORPAL_AGENT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}
      - name: Install musl toolchain
        run: |
          set -euo pipefail
          # musl.cc native toolchain for this runner's own architecture (both musl lanes
          # build natively). Retried download; the compile smoke below is the real gate.
          arch="$(uname -m)"
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/musl-native.tgz \
            "https://musl.cc/${arch}-linux-musl-native.tgz"
          sudo mkdir -p /opt/musl
          sudo tar -xzf /tmp/musl-native.tgz -C /opt/musl --strip-components=1
          rm /tmp/musl-native.tgz
          printf 'int main(void){return 0;}' > /tmp/musl-smoke.c
          "/opt/musl/bin/${arch}-linux-musl-gcc" -static /tmp/musl-smoke.c -o /tmp/musl-smoke-c
          printf 'int main(){return 0;}' > /tmp/musl-smoke.cc
          "/opt/musl/bin/${arch}-linux-musl-g++" -static -static-libstdc++ /tmp/musl-smoke.cc -o /tmp/musl-smoke-cc
          /tmp/musl-smoke-c && /tmp/musl-smoke-cc
          rm -f /tmp/musl-smoke*
      - name: Derive the loader's embedded public key (only when a signing key is configured)
        id: pubkey
        run: |
          if [ -n "${SIGNING_KEY}" ]; then
            pub=$(cargo run -q -p vorpal-loader --features keygen --bin vorpal-sign -- pubkey --key-hex "${SIGNING_KEY}")
            echo "hex=${pub}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the stage-0 loader (musl; public key embedded when available)
        env:
          VORPAL_LOADER_PUBKEY_HEX: ${{ steps.pubkey.outputs.hex }}
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static-libgcc -C link-arg=-static-libstdc++
        run: cargo build --release -p vorpal-loader --bin vorpal-loader --target ${{ matrix.target }}
      - name: Build the agent (the musl vorpal binary, launched as `__agent`)
        env:
          RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static-libgcc -C link-arg=-static-libstdc++
        run: cargo build --release -p vorpal --bin vorpal --target ${{ matrix.target }}
      - name: Sign the agent (if keyed) and record its blake3 pin
        run: |
          set -euo pipefail
          agent="target/${{ matrix.target }}/release/vorpal"
          if [ -n "${SIGNING_KEY}" ]; then
            cargo run -q -p vorpal-loader --features keygen --bin vorpal-sign -- sign \
              --key-hex "${SIGNING_KEY}" --agent "$agent" \
              --out "agent-${{ matrix.target }}.vld" \
              --manifest "agent-${{ matrix.target }}.json"
          else
            hash=$(cargo run -q -p vorpal-loader --features keygen --bin vorpal-sign -- hash --agent "$agent")
            printf '{\n  "target": "%s",\n  "blake3": "%s",\n  "signed": false\n}\n' \
              "${{ matrix.target }}" "$hash" > "agent-${{ matrix.target }}.json"
          fi
          cp "target/${{ matrix.target }}/release/vorpal-loader" "vorpal-loader-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-bundle-${{ matrix.target }}
          path: |
            vorpal-loader-${{ matrix.target }}
            agent-${{ matrix.target }}.json
            agent-${{ matrix.target }}.vld
          if-no-files-found: warn

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, agent-bundle, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # The CLI binaries, plus the fleet stage-0 loaders, signed agents, and blake3 pins.
          files: |
            artifacts/**/vorpal-*
            artifacts/**/vorpal-loader-*
            artifacts/**/agent-*.json
            artifacts/**/agent-*.vld
          generate_release_notes: true

  publish-cli-npm:
    name: Publish @hyper-light/vorpal-cli to npm
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: npm trusted publishing — no token, no 2FA
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Place binaries into platform packages
        run: |
          set -euo pipefail
          for pair in \
            vorpal-macos-arm64=darwin-arm64 \
            vorpal-linux-x64=linux-x64-gnu \
            vorpal-linux-arm64=linux-arm64-gnu \
            vorpal-linux-x64-musl=linux-x64-musl \
            vorpal-linux-arm64-musl=linux-arm64-musl \
            vorpal-windows-x64.exe=win32-x64-msvc \
            vorpal-windows-arm64.exe=win32-arm64-msvc \
            vorpal-windows-x86.exe=win32-ia32-msvc; do
            asset="${pair%%=*}"
            platform="${pair##*=}"
            binary="artifacts/${asset}/${asset}"
            case "$platform" in
              win32-*) cp "$binary" "npm/platforms/${platform}/vorpal.exe" ;;
              *)       cp "$binary" "npm/platforms/${platform}/vorpal" \
                         && chmod +x "npm/platforms/${platform}/vorpal" ;;
            esac
          done
      - name: Publish platform packages
        run: |
          set -euo pipefail
          for dir in npm/platforms/*/; do
            (cd "$dir" && npm publish --access public)
          done
      - name: Publish @hyper-light/vorpal-cli wrapper
        run: cd npm && npm publish --access public
