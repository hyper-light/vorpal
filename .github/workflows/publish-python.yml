# Python bindings: build vorpal-py wheels (abi3, one wheel per platform covering
# CPython >= 3.9) for manylinux, musllinux (Alpine), macOS, and Windows, plus an sdist,
# and publish to PyPI.
#
# Triggers: tag `v<version>` publishes; workflow_dispatch is a build-only dry run.
# Required repository secrets: PYPI_API_TOKEN.
name: Publish Python bindings

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The repo .cargo/config.toml names cross linkers (aarch64-linux-gnu-gcc / -musl-gcc);
  # the NATIVE aarch64 manylinux/musllinux images ship plain gcc. Env outranks config.
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: gcc

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, manylinux: auto }  # native build: an explicit target makes maturin demand a cross linker the image lacks
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          target: ${{ matrix.target || '' }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -m crates/pyo3/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          rust-toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          command: sdist
          args: --out dist -m crates/pyo3/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true  # 0.1.0 already live; a re-run must not 400 on duplicates
