# Node bindings: build the @vorpal/node native module for every platform, publish the
# per-platform packages and the main package to npm, plus @vorpal/wasm.
#
# Triggers: tag `v<version>` publishes; workflow_dispatch is a build-only dry run.
# Required repository secrets: NPM_TOKEN.
name: Publish Node bindings

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # musl targets build NATIVELY per arch (x86_64 on x64, aarch64 on arm64) — no container,
  # no cross toolchain. musl-tools' musl-gcc is the native musl linker (overriding the repo
  # config's cross-prefixed name); the build step links libgcc statically so the .node
  # carries no libgcc_s.so.1 runtime dependency.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CC_x86_64_unknown_linux_musl: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc
  NAPI_CLI_VERSION: 3.7.2

jobs:
  build:
    name: napi ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true, container: 'node:24' }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true, container: 'node:24' }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: i686-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: napi-${{ matrix.target }}
      - uses: actions/setup-node@v4
        if: ${{ !matrix.container }}
        with:
          node-version: 24
      - name: Install musl toolchain
        if: matrix.musl
        run: apt-get update && apt-get install -y musl-tools  # container runs as root; no sudo
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@${{ env.NAPI_CLI_VERSION }}
      - name: Build
        working-directory: crates/napi
        env:
          # Dynamic musl libc (loads against the host musl at runtime), libgcc linked
          # statically so the .node has no libgcc_s.so.1 dependency.
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static -C link-arg=-static-libgcc' || '' }}
        run: napi build --no-const-enum --dts ignore.d.ts --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/napi/vorpal-napi.*.node
          if-no-files-found: error

  publish:
    name: Publish @vorpal/node
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@${{ env.NAPI_CLI_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: crates/napi/artifacts
      - name: Move artifacts into platform packages
        working-directory: crates/napi
        run: napi artifacts
      - name: Publish (platform packages via prepublish, then main)
        working-directory: crates/napi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  wasm:
    name: Publish @vorpal/wasm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install wasm-pack
        run: npm install -g wasm-pack
      - name: Build
        run: wasm-pack build crates/wasm --release --scope vorpal
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd crates/wasm/pkg && npm publish --access public
