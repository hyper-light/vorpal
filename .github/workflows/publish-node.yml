# Node bindings: build the @hyper-light/vorpal-node native module for every platform, publish the
# per-platform packages and the main package to npm, plus @hyper-light/vorpal-wasm.
#
# Triggers: tag `v<version>` publishes; workflow_dispatch is a build-only dry run.
# Publishing uses npm TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN. Each package needs a
# trusted (or pending) publisher configured on npmjs.com pointing at this repo + workflow.
name: Publish Node bindings

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NAPI_CLI_VERSION: 3.7.2

jobs:
  # Non-musl targets build natively (glibc Linux, macOS, Windows); aarch64 on native arm64
  # runners — no cross toolchains.
  build:
    name: napi ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-13 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: i686-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: napi-${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@${{ env.NAPI_CLI_VERSION }}
      - name: Build
        working-directory: crates/napi
        run: napi build --no-const-enum --dts ignore.d.ts --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/napi/vorpal-napi.*.node
          if-no-files-found: error

  # musl .node builds inside the official node:24-alpine image, NATIVE per arch (x86_64 on
  # x64, aarch64 on arm64). Alpine is musl, so its native toolchain ships a musl libgcc and
  # the dynamic cdylib links cleanly — Debian's musl-tools only carries glibc's libgcc (wrong
  # ABI), which is why every VM-side attempt hit "cannot find libgcc_s.so.1", and +crt-static
  # is rejected for a cdylib. The container is launched via `docker run`, NOT `container:`, so
  # checkout/upload stay on the host and never trip GitHub's "JS actions in Alpine containers
  # are x64-only" rule on the arm64 runner.
  build-musl:
    name: napi ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Build .node in node:24-alpine (native musl)
        run: |
          docker run --rm -v "$PWD:/w" -w /w \
            -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            -e CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc \
            node:24-alpine sh -c '
              set -e
              apk add --no-cache build-base curl
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --default-toolchain 1.98.0 --profile default
              . "$HOME/.cargo/env"
              rustup target add ${{ matrix.target }}
              npm install -g @napi-rs/cli@${{ env.NAPI_CLI_VERSION }}
              cd crates/napi
              napi build --no-const-enum --dts ignore.d.ts --platform --release --target ${{ matrix.target }}
            '
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/napi/vorpal-napi.*.node
          if-no-files-found: error

  publish:
    name: Publish @hyper-light/vorpal-node
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: npm trusted publishing — no token, no 2FA
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - name: Install napi CLI
        run: npm install -g @napi-rs/cli@${{ env.NAPI_CLI_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          path: crates/napi/artifacts
      - name: Move artifacts into platform packages
        working-directory: crates/napi
        run: napi artifacts
      - name: Publish (platform packages via prepublish, then main)
        working-directory: crates/napi
        run: npm publish --access public

  wasm:
    name: Publish @hyper-light/vorpal-wasm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC: npm trusted publishing — no token, no 2FA
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0  # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest
      - name: Install wasm-pack
        run: npm install -g wasm-pack
      - name: Build
        run: wasm-pack build crates/wasm --release --scope hyper-light
      - name: Name the package @hyper-light/vorpal-wasm
        run: |
          cd crates/wasm/pkg
          node -e "const f='package.json',p=require('./'+f);p.name='@hyper-light/vorpal-wasm';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Publish
        run: cd crates/wasm/pkg && npm publish --access public
